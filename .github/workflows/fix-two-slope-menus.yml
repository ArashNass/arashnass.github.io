name: Fix two slope menus
on:
  push:
    paths:
      - .github/workflows/fix-two-slope-menus.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deployed tool menus
        run: |
          python - <<'PY'
          from pathlib import Path
          item='<a href="/slope-seismic-vulnerability/"><span class="hd-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="M5 19L14 6l5 13"/><path d="M9.5 12.5l8.5 1"/></svg></span><span class="hd-dd-lbl">Slope Seismic Vulnerability</span></a>'
          marker='<div class="hd-dd-cat">Structural Analysis</div>'
          paths=[Path('rc-section-designer/index.html'),Path('material-behaviour-explorer/index.html')]
          changed=[]
          for p in paths:
              s=p.read_text(encoding='utf-8')
              if 'Slope Seismic Vulnerability' not in s:
                  if marker not in s: raise SystemExit(f'Insertion marker missing: {p}')
                  p.write_text(s.replace(marker,item+marker,1),encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed) if changed else 'Already correct')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rc-section-designer/index.html material-behaviour-explorer/index.html
          git diff --cached --quiet || git commit -m "Fix slope vulnerability in RC and materials menus"
          git push
